-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><use href=\"#ar\"><\u002Fuse><\u002Fsvg><\u002Fspan><\u002Fdiv><div class=\"cd bot\"><span class=\"av\" style=\"width:44px;height:44px\"><svg aria-hidden=\"true\" width=\"25\" height=\"17\"><use href=\"#lg\"><\u002Fuse><\u002Fsvg><\u002Fspan><b>support bot<\u002Fb><span class=\"go\"><svg style=\"transform:rotate(180deg)\" aria-hidden=\"true\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><use href=\"#ar\"><\u002Fuse><\u002Fsvg><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"dk\" style=\"padding:104px 0 24px\">\n<div class=\"ctr\" style=\"text-align:center\">\n<div class=\"num rv\">FDScript<\u002Fdiv>\n<h2 class=\"big rv\" style=\"max-width:760px;margin:0 auto\"><span class=\"en\">Build a system <b>line by line.<\u002Fb><\u002Fspan><span class=\"ar\">ابنِ نظاماً <b>سطراً بسطر.<\u002Fb><\u002Fspan><\u002Fh2>\n<p class=\"lead rv\" style=\"max-width:660px;margin:18px auto 0\"><span class=\"en\">A tiny points system: a function picks a random reward, a variable stores it, and the bot replies. Scroll to watch it build.<\u002Fspan><span class=\"ar\">نظام نقاط صغير: دالة تختار مكافأة عشوائية، ومتغير يخزنها، والبوت يرد. مرّر للأسفل لتراه يُبنى.<\u002Fspan><\u002Fp>\n<div class=\"demo\">\n<div class=\"win rv\"><div class=\"wh\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><span>&nbsp;points.fds<\u002Fspan><em>FDScript<\u002Fem><\u002Fdiv><div class=\"cb\"><div class=\"ln\"><i>1<\u002Fi><span><s class=\"k\">$syncMode<\u002Fs><\u002Fspan><\u002Fdiv><div class=\"ln\"><i>2<\u002Fi><span>&nbsp;<\u002Fspan><\u002Fdiv><div class=\"ln\"><i>3<\u002Fi><span><s class=\"k\">$func<\u002Fs><s class=\"b\">[<\u002Fs>gain<s class=\"b\">]<\u002Fs><\u002Fspan><\u002Fdiv><div class=\"ln\"><i>4<\u002Fi><span><s class=\"f\">$randomint<\u002Fs><s class=\"b\">[<\u002Fs><s class=\"n\">5<\u002Fs><s cla
